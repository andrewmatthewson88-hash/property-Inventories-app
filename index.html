<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventory Pro</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#6a7380;--ac:#4a8a64;--bd:#dde1e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2329;--tx:#e8ebef;--mu:#98a2b0;--ac:#7fc392;--bd:#323943}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:#d33}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
textarea{min-height:52px}label{font-size:13px;color:var(--mu);display:block;margin:6px 0 2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}.row>button{flex:0 0 auto}
.item{border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}
.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.th div{position:relative}
.th img{width:72px;height:72px;object-fit:cover;border-radius:6px}
.th b{position:absolute;top:-4px;right:-4px;background:#d33;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;font-size:13px;line-height:20px;cursor:pointer}
.mu{color:var(--mu);font-size:14px}
.paper{background:#fff;color:#111;padding:22px;border-radius:6px;border:1px solid #ccc}
.paper h1{font-size:24px;margin:0}.paper h2{background:#eef1f5;padding:6px 8px;margin:18px 0 6px;font-size:16px}
.paper table{width:100%;border-collapse:collapse;font-size:14px}.paper td,.paper th{border:1px solid #ccc;padding:5px 7px;text-align:left;vertical-align:top}
.paper .ph img{width:110px;height:110px;object-fit:cover;margin:3px 3px 0 0}
.paper .sig{display:flex;gap:30px;margin-top:40px}.paper .sig div{flex:1;border-top:1px solid #111;padding-top:4px;font-size:13px}
@media print{body{background:#fff}#app{padding:0;max-width:none}.noprint{display:none!important}.paper{border:0;padding:0}.paper h2{break-after:avoid}.paper tr{break-inside:avoid}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px}.dh{font-size:11px;color:var(--mu);text-align:center}.dc{min-height:64px;border:1px solid var(--bd);border-radius:6px;padding:2px;overflow:hidden;cursor:pointer;font-size:10px;line-height:1.25;min-width:0}.dc.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}.dc span{font-weight:600;font-size:12px;display:block;width:fit-content}.dc.td span{background:var(--ac);color:#fff;border-radius:10px;padding:0 5px}.dc i{display:block;font-style:normal;background:var(--ac);color:#fff;border-radius:3px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dc i.iv{background:var(--mu)}.dc em{color:var(--mu);font-style:normal}
.pf{display:none}.paper figure{display:inline-block;margin:4px;font-size:10px;text-align:center}.paper .pb,.paper .cover{margin-bottom:20px}.sigb{border:1px solid #999;padding:4px 8px;margin:10px 0;break-inside:avoid}.sigb div{border-bottom:1px dotted #999;padding:6px 0}
@media print{.pf{display:flex;justify-content:space-between;position:fixed;bottom:0;left:0;right:0;font-size:11px;color:#555}.paper{padding-bottom:28px}.cover,.pb{break-after:page}}
.jump{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0}.card,.item{scroll-margin-top:64px}
.paper,.paper *{-webkit-print-color-adjust:exact;print-color-adjust:exact}.paper{font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#222}
.paper .cover h1{text-align:center;font-size:28px;margin:0 0 14px}.cvbox{border:1px solid #e3e3e3;max-width:430px;margin:12px auto;text-align:center;padding:34px 20px}.cvbox img{max-width:210px;height:auto}
.cvp{text-align:center;font-size:13px;line-height:1.9;margin:20px 0}.cv3{display:flex;gap:14px;align-items:flex-start;margin-top:24px}.cv3>div{flex:1;min-width:0}.cv3 b.h{display:block;border-bottom:1px solid #e3e3e3;padding-bottom:5px;font-size:16px}.cvd{font-size:26px;font-weight:700;text-align:right;margin-top:8px;line-height:1.25}.cvd small{font-size:17px}
.sh{background:#f3f4f6;border:1px solid #e3e5e8;padding:10px 12px;font-weight:700;font-size:12px;text-transform:uppercase;margin:18px 0 0;break-after:avoid}
.paper .tb{width:100%;border-collapse:collapse;font-size:12px}.paper .tb th,.paper .tb td{border:0;padding:9px 10px;vertical-align:top;text-align:left}.paper .tb th{background:#f8f9fa;color:#666;border-bottom:1px solid #e3e5e8}.paper .tb tr:nth-child(odd) td{background:#fafafc}.paper .tb td:first-child,.paper .tb th:first-child{width:46px;font-weight:700;font-size:10px;color:#444}
.toc div{padding:7px 4px;border-bottom:1px dotted #bbb;font-size:14px}
.pg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}.pt{background:#f7f7f9;padding:8px;text-align:center;break-inside:avoid}.pt .im{position:relative;display:inline-block;max-width:100%}.pt img{max-height:175px;max-width:100%;width:auto;height:auto;display:block}.pt .ts{position:absolute;right:0;bottom:0;background:#000;color:#fff;font-size:9px;font-style:italic;padding:1px 4px}.pt i{display:block;font-size:10px;color:#555;margin-top:3px}
@page{size:A4;margin:12mm 12mm 16mm;@bottom-right{content:"Page " counter(page) " of " counter(pages);font-size:10px;color:#555}}
#app{padding-bottom:96px}
.brand{display:flex;align-items:center;gap:12px;margin:2px 0 14px}.brand img{width:54px;height:54px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--bd)}.brand b{display:block;font-size:20px}.brand span{color:var(--mu);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.st{text-align:left;padding:10px;border-radius:12px;background:var(--card)}.st b{display:block;font-size:19px;color:var(--ac)}.st span{font-size:12px;color:var(--mu)}
.rt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.ag{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--bd);margin-top:8px}.ag b{flex:0 0 76px;font-size:13px}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;text-transform:uppercase}.tag.iv{background:#e3f0e6;color:#2f6a46}.tag.co{background:#fdebd3;color:#8a5a10}.tag.in{background:#e1ebfa;color:#2b5aa0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}.tabs button{flex:1;border:0;border-radius:0;background:none;padding:9px 2px;font-size:12px;line-height:1.3;color:var(--mu)}.tabs button.on{color:var(--ac);font-weight:700}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#0d1f14}}
.inv{padding:26px}.ivh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:3px solid #4a8a64;padding-bottom:14px}.ivl{max-width:110px;max-height:110px;height:auto}.ivt{text-align:right;line-height:1.6}.ivti{font-size:30px;font-weight:700;color:#4a8a64;letter-spacing:2px}
.ivp{display:inline-block;margin-top:6px;border:2px solid #2f8f4f;color:#2f8f4f;font-weight:700;padding:2px 12px;border-radius:4px;transform:rotate(-6deg)}
.ivc{display:flex;gap:20px;margin:18px 0}.ivc>div{flex:1}.ivk{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#777;margin-bottom:4px}
.paper .ivtb{width:100%;border-collapse:collapse;font-size:13px}.paper .ivtb th{background:#4a8a64;color:#fff;border:0;padding:9px 10px;text-align:left}.paper .ivtb td{border:0;border-bottom:1px solid #e3e5e8;padding:9px 10px;vertical-align:top}.paper .ivtb tr:nth-child(even) td{background:#f7faf8}.paper .ivtb .r{text-align:right;white-space:nowrap}
.ivs{margin:14px 0 0 auto;width:55%;max-width:300px}.ivs>div{display:flex;justify-content:space-between;padding:5px 10px}.ivg{background:#4a8a64;color:#fff;font-weight:700;font-size:16px;border-radius:4px;margin-top:4px}
.ivb{margin-top:26px;background:#f3f4f6;border-radius:6px;padding:12px 14px;font-size:13px}.ivf{margin-top:30px;text-align:center;color:#777;font-size:12px}
textarea[data-k]{min-height:72px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:50;font-size:14px;max-width:90%;text-align:center}
.chg{border:1px solid #e3e5e8;border-radius:6px;padding:10px;margin-top:10px;break-inside:avoid}.cc{display:flex;gap:14px;margin-top:6px}.cc>div{flex:1;min-width:0}.sp img{max-height:110px;max-width:48%;margin:4px 4px 0 0}
</style></head><body><div id="app"></div>

ucts, you acknowledge and accept that KLM Inventories is not liable for any consequences arising from failure to comply with the relevant legislation, and you agree to take full responsibility for ensuring compliance with the regulations.\n\nFor more detailed guidance on the Smoke and Carbon Monoxide Alarm (England) Regulations 2022, please consult official government resources or seek legal advice.\n\nFurniture & Furnishings (Fire) (Safety) Regulations 1988 (1993)\n\nThe fire and safety regulations regarding furnishing, gas, electrical and similar services are ultimately the responsibility of the instructing principal. Where the Inventory notes \"Fire Regulation Label Attached\", this should not be interpreted to mean the item complies with the \"furniture and furnishings (fire) (safety) (amendments) 1993\". It is a record that the item had a label as described or similar to that detailed in the \"guide\" published by the Department of Trade and Industry January 1997 (or subsequent date). It is not a statement that the item can be considered to comply with the Regulations.";
